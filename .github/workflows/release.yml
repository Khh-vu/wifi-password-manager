name: Build & Deploy Android app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.VERSION_CODE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version code
        id: version
        run: |
          VERSION_CODE=$(grep -oP '^\s*versionCode = \K\d+' ./app/build.gradle.kts)
          if [ -z "$VERSION_CODE" ] || [ "$(echo "$VERSION_CODE" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one versionCode in app/build.gradle.kts, got: '$VERSION_CODE'" >&2
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check changelog exists
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.VERSION_CODE }}.txt"
          if [ ! -f "$CHANGELOG" ]; then
            echo "Missing changelog: $CHANGELOG" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          cache: gradle
          distribution: temurin

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"

      - name: Create keystore.properties file
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/key.jks"
            printf 'keyAlias=%s\n' "$KEYSTORE_KEY_ALIAS"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: Lint and build Release APK
        run: ./gradlew lintRelease assembleRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            ./app/build/outputs/apk/release/app-release.apk
            ./app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-files
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            ./artifacts/apk/release/app-release.apk \
            ./artifacts/mapping/release/mapping.txt
