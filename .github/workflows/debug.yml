name: Build Debug Android app

env:
  GRADLE_OPTS: "-Xmx2048M -Dfile.encoding=UTF-8"

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-cleanup: on-success
          cache-overwrite-existing: true

      - name: Decode Keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"

      - name: Create keystore.properties file
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/key.jks"
            printf 'keyAlias=%s\n' "$KEYSTORE_KEY_ALIAS"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"

      - name: Rename APK file
        run: |
          mv ./app/build/outputs/apk/debug/app-debug.apk ./app/build/outputs/apk/debug/wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}
          path: ./app/build/outputs/apk/debug/wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 2
